# Agentic Workspace Configuration
# This file centralizes workspace behavior settings.
# Skills inherit these defaults; override in project-specific forks.

workspace:
  name: "Agentic Workspace"
  version: "1.0.0"

  # Language for agent responses (ISO 639-1 code)
  # All skills respond in this language
  response_language: "es"  # "es" = Spanish | "en" = English | "pt" = Portuguese

  # Primary languages the agent has deep expertise in
  primary_languages:
    - python
    - javascript
    - typescript

  # Secondary languages with structural/architectural support
  secondary_languages:
    - go
    - java
    - rust

# ──────────────────────────────────────────────────────────────────────────
# Project conventions. EDIT THESE to make every skill follow your house style.
# A skill consumes the relevant section during its "Reference Loading" step,
# so changing a value here changes the agent's behavior — no code edits needed.
# ──────────────────────────────────────────────────────────────────────────
conventions:
  # Consumed by: git-workflow AND every commit the agent writes.
  # CLAUDE.md → "Project Conventions" surfaces these so they ALWAYS apply.
  commits:
    style: "descriptive"           # NO type prefix — never feat:/fix:/docs:/perf: etc.
    language: "es"                 # subject/body in Spanish unless English is requested
    subject: "Título descriptivo en español que resume el avance (verbo + objeto), sin prefijo de tipo, sin punto final."
    body: "SIEMPRE incluir los detalles como lista de guiones '-', cada punto conciso, en español."
    coauthor: false                # do NOT add 'Co-Authored-By: Claude' unless explicitly asked
    emojis: false
    trailing_period: false
    max_subject_length: 72

  # Consumed by: docs-generator (technical docs in markdown / code).
  documentation:
    language: "es"
    style: "Detallada pero al grano, legible y clara para un programador. Sin relleno."
    docstring_style:
      python: "google"             # "google" | "numpy" | "rest"
      typescript: "jsdoc"
    changelog_format: "keep-a-changelog"
    date_format: "YYYY-MM-DD"
    readme_sections: ["Título y badges", "Descripción", "Quick Start", "Instalación", "Uso", "Configuración", "Desarrollo", "Licencia"]

  # Consumed when generating a FORMAL document (.docx / Word). Full spec in the reference file.
  document_format:
    applies_to: "Documentos Word/.docx formales (no markdown, READMEs ni docstrings)"
    spec: ".agents/shared/document-style.md"

skills:
  # Global defaults applied to all skills
  defaults:
    # Minimum severity to include in reports (critical | high | medium | low)
    min_severity_to_report: "low"
    # Include before/after code examples in proposals
    include_code_examples: true
    # Limit review scope to files explicitly mentioned (false = analyze full codebase)
    scoped_review: false

  # Per-skill overrides (uncomment and customize as needed)
  # code-improver:
  #   max_files_per_review: 10
  #   focus: ["security", "performance"]  # Focus only on these categories
  #
  # security-auditor:
  #   severity_threshold: "medium"  # Only report medium and above
  #   include_supply_chain: true
  #
  # project-scaffolder:
  #   default_stack: "python-api"    # Pre-select a template
  #   include_docker: true
  #   include_ci: true
  #
  # test-strategist:
  #   coverage_target:
  #     unit: 80
  #     branch: 75
  #   preferred_framework: "vitest"  # "vitest" | "jest" | "pytest"

pipelines:
  # Secuencias ordenadas de skills para flujos comunes.
  # Cada skill ejecuta en orden; los hallazgos de una informan a la siguiente.
  new-project:
    description: "Pipeline completo para arrancar un nuevo proyecto"
    steps:
      - software-architect  # Diseñar la arquitectura primero
      - project-scaffolder  # Generar estructura basada en el diseño
      - test-strategist     # Definir estrategia de testing
      - security-auditor    # Asegurar tooling de seguridad desde el inicio
      - docs-generator      # Generar README y docs iniciales

  code-review:
    description: "Revisión integral de calidad y seguridad del código"
    steps:
      - structure-analyzer  # Mapear el codebase primero
      - code-improver       # Identificar problemas de calidad
      - security-auditor    # Identificar problemas de seguridad

  audit-full:
    description: "Auditoría completa de salud del proyecto"
    steps:
      - structure-analyzer  # Arquitectura y salud de la estructura
      - security-auditor    # Postura de seguridad
      - test-strategist     # Cobertura y calidad de tests
      - code-improver       # Calidad del código
      - docs-generator      # Brechas de documentación

  quick-review:
    description: "Revisión rápida de un archivo o módulo pequeño"
    steps:
      - code-improver
      - security-auditor
