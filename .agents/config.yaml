# Agentic Workspace — Configuración central
# Stack principal: Python / Node.js, PostgreSQL, Docker.

workspace:
  name: "Agentic Workspace"
  version: "2.0.0"
  response_language: "es"  # "es" | "en" | "pt"

# ──────────────────────────────────────────────────────────────────────────
# Convenciones de commits.
# generate_agent_rules.py lee esta sección y la vuelca en CLAUDE.md,
# así que aplica a TODOS los commits que escribe Claude, siempre.
# ──────────────────────────────────────────────────────────────────────────
conventions:
  # ──────────────────────────────────────────────────────────────────────────
  # Estilo de código generado.
  # El generador vuelca estas reglas en CLAUDE.md → aplican siempre.
  # ──────────────────────────────────────────────────────────────────────────
  code:
    language: "en"                  # Todo el código en inglés
    comments_language: "es"         # Comentarios siempre en español
    docstrings: false               # Sin triple comilla — solo comentarios #
    dash: "-"                       # Solo guión simple; nunca guión largo "—"
    naming: "snake_case"            # nombre_variable, nombre_funcion
    naming_style: "descriptive"     # Nombres claros y significativos
    error_handling: "explicit"      # Cada error con mensaje específico; sin swallowing
    structure: "pragmatic"          # Sin patrones forzados; legible > perfecto
    function_comments: true         # Comentarios # dentro de funciones que guíen el procedimiento
    file_sections: |                # Formato de separación de secciones en archivos
      # =============================================
      # Nombre de la sección
      # ---------------------------------------------

  commits:
    style: "descriptive"       # Sin prefijo de tipo (nunca feat:/fix:/docs:)
    language: "es"
    subject: "Título descriptivo en español que resume el avance, sin prefijo de tipo, sin punto final."
    body: "SIEMPRE incluir los detalles como lista de guiones '-', cada punto conciso, en español."
    coauthor: false
    emojis: false
    trailing_period: false
    max_subject_length: 72
