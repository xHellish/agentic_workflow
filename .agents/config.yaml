# Agentic Workspace — Configuración central
# Stack principal: Python / Node.js, PostgreSQL, Docker.

workspace:
  name: "Agentic Workspace"
  version: "2.0.0"
  response_language: "es"  # "es" | "en" | "pt"

# ──────────────────────────────────────────────────────────────────────────
# Convenciones de commits.
# generate_agent_rules.py lee esta sección y la vuelca en CLAUDE.md,
# así que aplica a TODOS los commits que escribe Claude, siempre.
# ──────────────────────────────────────────────────────────────────────────
conventions:
  commits:
    style: "descriptive"       # Sin prefijo de tipo (nunca feat:/fix:/docs:)
    language: "es"
    subject: "Título descriptivo en español que resume el avance, sin prefijo de tipo, sin punto final."
    body: "SIEMPRE incluir los detalles como lista de guiones '-', cada punto conciso, en español."
    coauthor: false
    emojis: false
    trailing_period: false
    max_subject_length: 72
